apiVersion : apps/v1
kind: Deployment
metadata:
  name: weadminportal
  namespace: weadminportal
  labels:
    app: weadminportal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weadminportal
  template:
    metadata:
      labels:
        app: weadminportal
    spec:     
      containers:
        - name: weadminportal 
          image: acrwedev111.azurecr.io/weadminportal:latest
          ports:
            - containerPort: 80
          # envFrom:
          #   - configMapRef:
          #       name: weadminportal-config
            # - secretRef:
            #    name: share-services-secrets
          #resources:
          #  requests:
          #    cpu: "1"
          #    memory: "1500Mi"
          #  limits:
          #    cpu: "1.5"
          #    memory: "4096Mi"
          # args:
          #   - /server
          # livenessProbe:
          #   httpGet:
          #     path: /healthcheck
          #     port: 80
          #   initialDelaySeconds: 10
          #   periodSeconds: 30
          #   failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
    name: weadminportal
    namespace: weadminportal
spec:
    type: ClusterIP
    ports:
    - port: 80 
      protocol: TCP
      targetPort: 80
    selector:
        app: weadminportal
#kind: Service
