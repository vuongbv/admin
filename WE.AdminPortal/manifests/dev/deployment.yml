---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
 name: weadminportal-ingress
 namespace: weadminportal
 annotations:
   nginx.ingress.kubernetes.io/rewrite-target: /$1
   nginx.ingress.kubernetes.io/use-regex: "true"
   kubernetes.io/ingress.class: nginx
spec:
 rules:
   - host: 
     http:
      paths:
        - path: /admin/(.*)
          pathType: Prefix
          backend:
            service:
              name: weadminportal
              port:
                number: 80
status:
  loadBalancer:
    ingress:
      - ip: 20.24.136.248
