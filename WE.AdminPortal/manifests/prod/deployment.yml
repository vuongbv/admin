
apiVersion : apps/v1
kind: Deployment
metadata:
  name: weadminportal
  namespace: weadminportal
  labels:
    app: weadminportal
#  annotations:
#    date: "+%H:%M:%S %d/%m/%y"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weadminportal
  template:
    metadata:
      labels:
        app: weadminportal
    spec:     
      containers:
        - name: weadminportal 
          image: acrweiot.azurecr.io/weadminportal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          # envFrom:
          #   - configMapRef:
          #       name: weadminportal-config
            # - secretRef:
            #    name: share-services-secrets
          #resources:
          #  requests:
          #    cpu: "1"
          #    memory: "1500Mi"
          #  limits:
          #    cpu: "1.5"
          #    memory: "4096Mi"
          # args:
          #   - /server
          # livenessProbe:
          #   httpGet:
          #     path: /healthcheck
          #     port: 80
          #   initialDelaySeconds: 10
          #   periodSeconds: 30
          #   failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
    name: weadminportal
    namespace: weadminportal
spec:
    type: ClusterIP
    ports:
    - port: 80 
      protocol: TCP
      targetPort: 80
    selector:
        app: weadminportal

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
 name: weadminportal-ingress
 namespace: weadminportal
 annotations:
   nginx.ingress.kubernetes.io/rewrite-target: /$1
   nginx.ingress.kubernetes.io/use-regex: "true"
   kubernetes.io/ingress.class: nginx
spec:
 rules:
   - host: 
     http:
      paths:
        - path: /admin/(.*)
          pathType: Prefix
          backend:
            service:
              name: weadminportal
              port:
                number: 80
status:
  loadBalancer:
    ingress:
      - ip: 20.24.136.248
