<div class="card">
  <h5>Device Manage</h5>
  <div class="card">
    <div
      class="flex justify-content-between flex-column sm:flex-row grid p-fluid"
    >
      <div class="field col">
        <label htmlFor="device_name">Device Name</label>
        <input
          pInputText
          id="device_name"
          type="text"
          device_name="ngModel"
          name="device_name"
          [(ngModel)]="deviceName"
        />
      </div>
      <div class="field col">
        <label htmlFor="device_id">Device Id</label>
        <input
          pInputText
          id="sourceId"
          type="text"
          sourceId="ngModel"
          name="sourceId"
          [(ngModel)]="sourceId"
        />
      </div>
    </div>
    <div class="flex justify-content-between flex-wrap">
      <div class="flex align-items-center w-4">
        <button
          pButton
          pRipple
          label="Search"
          icon="pi pi-search"
          class="p-button-primary w-4 mr-2"
          (click)="onSearch()"
        ></button>
      </div>
    </div>
  </div>
  <p-table
    [value]="devices"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="total"
    [lazy]="true"
    (onLazyLoad)="lazyLoadTabel($event)"
    [first]="firstPage"
    sortField="Name"
    [sortOrder]="-1"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="Name">
          Name<p-sortIcon field="Name"></p-sortIcon>
        </th>
        <th pSortableColumn="Owner">
          Owner<p-sortIcon field="Owner"></p-sortIcon>
        </th>
        <th pSortableColumn="SourceId">
          Source Id<p-sortIcon field="SourceId"></p-sortIcon>
        </th>
        <th pSortableColumn="OperationStatus">
          Operation Status<p-sortIcon field="OperationStatus"></p-sortIcon>
        </th>
        <th pSortableColumn="Status">
          Status<p-sortIcon field="Status"></p-sortIcon>
        </th>
        <th style="width: 10%">action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-device>
      <tr>
        <td>{{ device.name }}</td>
        <td>{{ device.owner }}</td>
        <td>{{ device.source_id }}</td>
        <td>{{ device.operation_status }}</td>
        <td>{{ device.status }}</td>
        <td>
          <p-button
            type="button"
            pRipple
            icon="pi pi-pencil"
            styleClass="p-button-rounded p-button-text"
            (click)="edit(device.id)"
          ></p-button>
          <!-- <p-button
            type="button"
            pRipple
            [icon]="
            device.status == 'active'
                ? 'pi pi-lock'
                : 'pi pi-lock-open'
            "
            class="p-button p-component p-button-text p-button-icon-only"
            (click)="ActiveOrDeactive(device.id, device.status)"
          ></p-button> -->
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
